}

#bg{
position:fixed;
inset:0;
z-index:-1;
}

nav{
margin-top:40px;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 40px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-weight:900;
letter-spacing:3px;
cursor:pointer;
}

.menu span{
margin-left:15px;
cursor:pointer;
opacity:0.7;
}

.hero{
padding:50px 40px 10px;
}

.hero h1{
font-size:3rem;
margin:0;
}

.hero p{
opacity:0.7;
}

.quick{
display:flex;
gap:10px;
padding:10px 40px;

}

.quick button{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.12);
color:white;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
backdrop-filter:blur(10px);
}

.section{
padding:20px 40px 10px;
opacity:0.8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:10px 40px 40px;
}

.card{
height:120px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.12);
border-radius:14px;
cursor:pointer;
transition:0.2s;
backdrop-filter:blur(16px);
}

.card:hover{
transform:translateY(-5px);
border:1px solid rgba(255,255,255,0.25);
}

#modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
align-items:center;
justify-content:center;
backdrop-filter:blur(10px);
}

.box{
padding:25px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.2);
border-radius:16px;
}

#admin{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
align-items:center;
justify-content:center;
}

.panel{
width:380px;
padding:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.15);
border-radius:16px;
text-align:center;
}

footer{
margin-top:40px;
padding:30px;
text-align:center;
opacity:0.4;
border-top:1px solid rgba(255,255,255,0.1);
}
</style>

/* RENDER */
function render(){
let f=document.getElementById("featured");
let a=document.getElementById("allGames");
f.innerHTML="";
a.innerHTML="";

games.forEach(g=>{
let c=document.createElement("div");
c.className="card";
c.innerText=g.name;
c.onclick=()=>openGame(g.url,g.name);
a.appendChild(c);
});

games.slice(0,8).forEach(g=>{
let c=document.createElement("div");
c.className="card";
c.innerText=g.name;
c.onclick=()=>openGame(g.url,g.name);
f.appendChild(c);
});
}
render();

/* TRENDING FIXED */
async function loadTrending(){
let snap=await getDocs(collection(db,"gameClicks"));
let map={};

snap.forEach(d=>{
let n=d.data().name;
map[n]=(map[n]||0)+1;
});

let sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);

let el=document.getElementById("trending");
el.innerHTML="";

sorted.slice(0,6).forEach(([name])=>{
let game=games.find(g=>g.name===name);
if(!game)return;

let c=document.createElement("div");
c.className="card";
c.innerText=game.name;
c.onclick=()=>openGame(game.url,game.name);
el.appendChild(c);
});
}
