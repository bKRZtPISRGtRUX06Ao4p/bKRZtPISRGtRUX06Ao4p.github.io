<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epstein Clicker - Fullscreen</title>
    <style>
        /* Remove default browser margins and hide scrollbars on the main page */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* Optional: black background while loading */
        }

        /* Make the iframe cover the entire screen */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://epsteinclicker.com/play.html" 
        allow="fullscreen" 
        allowfullscreen="true">
        Your browser does not support iframes.
    </iframe>

</body>
</html>
