<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPOSTOR</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --purple: #a855f7;
            --glow: 0 0 15px #a855f7;
            --danger: #f87171;
            --text: #ffffff;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            width: 320px;
            text-align: center;
            border: 2px solid var(--purple);
            box-shadow: var(--glow);
        }
        h1 { color: var(--purple); text-shadow: var(--glow); margin-bottom: 20px; letter-spacing: 2px; }
        input {
            background: #111; color: white; padding: 12px;
            border: 1px solid var(--purple); width: 100%; box-sizing: border-box;
            border-radius: 8px; margin-bottom: 10px; outline: none;
        }
        button {
            background: transparent; color: var(--purple); border: 2px solid var(--purple);
            padding: 12px; border-radius: 8px; cursor: pointer;
            font-weight: bold; width: 100%; margin-top: 10px; box-shadow: var(--glow);
        }
        button:hover { background: var(--purple); color: black; }
        .hidden { display: none; }
        .label { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .category { font-weight: bold; color: var(--purple); font-size: 24px; margin-bottom: 15px; }
        .word { font-size: 32px; font-weight: bold; margin: 20px 0; text-shadow: var(--glow); }
        .impostor-text { color: var(--danger); font-size: 28px; font-weight: bold; text-shadow: 0 0 10px var(--danger); }
        .hint-box { border: 1px dashed var(--danger); padding: 10px; margin-top: 15px; font-size: 14px; color: var(--danger); }
        .order-display { color: var(--purple); font-size: 13px; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-setup">
        <h1>IMPOSTOR</h1>
        <div id="input-list">
            <input type="text" class="player-name" placeholder="Player 1">
            <input type="text" class="player-name" placeholder="Player 2">
            <input type="text" class="player-name" placeholder="Player 3">
        </div>
        <button onclick="addInput()">+ Add Player</button>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="screen-pass" class="hidden">
        <p class="label" id="step-count">Step 1</p>
        <p>Pass device to:</p>
        <h2 id="next-player-name" style="color:var(--purple)">NAME</h2>
        <button onclick="showSecret()">View Word</button>
    </div>

    <div id="screen-secret" class="hidden">
        <p class="label">Category</p>
        <div id="display-cat" class="category"></div>
        <div id="box-word">
            <p class="label">The Word</p>
            <div id="display-word" class="word">WORD</div>
        </div>
        <div id="box-impostor" class="hidden">
            <div class="impostor-text">IMPOSTOR</div>
            <div class="hint-box">
                <b>HINT:</b> <span id="impostor-hint"></span>
            </div>
        </div>
        <button onclick="confirmSecret()">Done</button>
    </div>

    <div id="screen-play" class="hidden">
        <h1>Discussion</h1>
        <p class="label">Category</p>
        <div id="play-cat" class="category"></div>
        <p class="label">Turn Order</p>
        <div id="play-order" class="order-display"></div>
        <button onclick="revealResults()">Reveal Impostor</button>
    </div>

    <div id="screen-result" class="hidden">
        <h1>Results</h1>
        <p class="label">The Impostor was:</p>
        <h2 id="result-name" style="color:var(--danger)">NAME</h2>
        <p class="label">The word was:</p>
        <h2 id="result-word" style="color:var(--purple)">WORD</h2>
        <button onclick="location.reload()">New Game</button>
    </div>
</div>

    const gameDB = JSON.parse(atob(b64Data));
    let players = [];
    let impostorIdx = -1;
    let turn = 0;
    let currentWord = "";
    let currentCat = "";
    let currentHint = "";

    function addInput() {
        const div = document.getElementById('input-list');
        const count = div.getElementsByTagName('input').length;
        if (count < 10) {
            const input = document.createElement('input');
            input.type = "text";
            input.className = "player-name";
            input.placeholder = "Player " + (count + 1);
            div.appendChild(input);
        }
    }

    function startGame() {
        players = [];
        const inputs = document.querySelectorAll('.player-name');
        inputs.forEach(i => {
            if (i.value.trim() !== "") players.push(i.value.trim());
        });

        if (players.length < 3) {
            alert("Min 3 players needed.");
            return;
        }

        const data = gameDB[Math.floor(Math.random() * gameDB.length)];
        currentCat = data.c;
        currentHint = data.h;
        currentWord = data.w[Math.floor(Math.random() * data.w.length)];
        impostorIdx = Math.floor(Math.random() * players.length);
        turn = 0;

        document.getElementById('screen-setup').classList.add('hidden');
        showPass();
    }

    function showPass() {
        document.getElementById('screen-secret').classList.add('hidden');
        document.getElementById('screen-pass').classList.remove('hidden');
        document.getElementById('next-player-name').innerText = players[turn];
        document.getElementById('step-count').innerText = "Step " + (turn + 1) + " of " + players.length;
    }

    function showSecret() {
        document.getElementById('screen-pass').classList.add('hidden');
        document.getElementById('screen-secret').classList.remove('hidden');
        document.getElementById('display-cat').innerText = currentCat;

        if (turn === impostorIdx) {
            document.getElementById('box-word').classList.add('hidden');
            document.getElementById('box-impostor').classList.remove('hidden');
            document.getElementById('impostor-hint').innerText = currentHint;
        } else {
            document.getElementById('box-word').classList.remove('hidden');
            document.getElementById('box-impostor').classList.add('hidden');
            document.getElementById('display-word').innerText = currentWord;
        }
    }

    function confirmSecret() {
        turn++;
        if (turn < players.length) {
            showPass();
        } else {
            document.getElementById('screen-secret').classList.add('hidden');
            document.getElementById('screen-play').classList.remove('hidden');
            document.getElementById('play-cat').innerText = currentCat;
            document.getElementById('play-order').innerText = players.join(" → ");
        }
    }

    function revealResults() {
        document.getElementById('screen-play').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('result-name').innerText = players[impostorIdx];
        document.getElementById('result-word').innerText = currentWord;
    }
</script>

</body>
</html>
